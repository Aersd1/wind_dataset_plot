[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-dataset-plot"
version = "0.1.0"
description = "Gap-aware, source-dataset-aware wind time-series analysis and publication figures"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.1,<4", "matplotlib>=3.8,<4",
  "scipy>=1.11,<2", "statsmodels>=0.14,<0.16", "scikit-learn>=1.4,<2"
]

[project.scripts]
wind-dataset-plot = "wind_dataset_plot.cli:main"

[tool.setuptools.packages.find]
include = ["wind_dataset_plot*"]
